# GitLab CI for the publisher title-increment pipeline.
#   test     — runs on every push; pytest against a disposable Postgres service
#   init     — schedules only; idempotent schema migration, once per pipeline
#   pipeline — schedules only; one job per stream (Springer + each publisher), so
#              a failure in one stream never hides the others. Jobs share a
#              resource_group, so only one writes to the database at a time.
#
# Needs the DATABASE_URL masked variable in project settings (Settings → CI/CD),
# otherwise the orchestrator safely falls back to file-only mode.
#
# Optional schedule variable SCHEDULE_TARGET lets one project run several
# schedules at different intervals:
#   (unset)     → Springer and all publishers
#   springer    → Springer series only
#   publishers  → publishers only
#
# Volume: the busiest stream (Wiley) registers ~45 titles/day, so a 5000-result cap
# leaves room for a schedule that was paused for months. If a run ever does hit
# the cap it is logged 'partial' and the watermark is NOT advanced (nothing is
# lost) - raise --max-results if you see that.
#
# Adding a publisher: add it to config.json AND to the matrix below
# (tests/test_ci_config.py fails if the two drift apart).
#
# All jobs use stock Docker Hub images — no custom registry needed.

stages:
  - test
  - init
  - pipeline

default:
  interruptible: true

# ---------------------------------------------------------------------------
# Stage: test — every push gets a full test run
# ---------------------------------------------------------------------------
test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: springer_test
    POSTGRES_USER: springer
    POSTGRES_PASSWORD: springer_test
    TEST_DATABASE_URL: postgresql+psycopg2://springer:springer_test@postgres:5432/springer_test
  before_script:
    - pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
  script:
    - pytest -v

# ---------------------------------------------------------------------------
# Stages: init + pipeline — the scheduled "interval extraction" the assignment requires
# ---------------------------------------------------------------------------
.scheduled:
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  cache:
    key: pip
    paths:
      - .pip-cache
  artifacts:
    when: always
    paths:
      - logs/
    expire_in: 30 days

init-database:
  extends: .scheduled
  stage: init
  script:
    - python init_database.py          # idempotent schema safety (adds work_type etc.)
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

springer:
  extends: .scheduled
  stage: pipeline
  resource_group: neon-database
  script:
    - python orchestrator.py --incremental --no-publishers --max-results 5000
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && ($SCHEDULE_TARGET == null || $SCHEDULE_TARGET == "" || $SCHEDULE_TARGET == "springer")

publisher:
  extends: .scheduled
  stage: pipeline
  resource_group: neon-database
  parallel:
    matrix:
      - PUBLISHER: [ELSEVIER, WILEY, IEEE, ACM]
  script:
    - python orchestrator.py --incremental --publisher "$PUBLISHER" --max-results 5000
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && ($SCHEDULE_TARGET == null || $SCHEDULE_TARGET == "" || $SCHEDULE_TARGET == "publishers")
